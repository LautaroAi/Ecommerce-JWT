name: CI - XP-Commerce-Backend

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Typecheck, Build y BDD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Chequeo de tipos (TypeScript strict)
        run: npm run typecheck

    # Para cuando todas estén en GREEN, ignorar de momento
      #- name: Compilar proyecto
      #  run: npm run build
        
        # Agregar las otras cuando estén en GREEN
      - name: Ejecutar pruebas BDD (HU3, HU4, HU5)
        run: |
          npm run test:bdd:hu3
          npm run test:bdd:hu4
          npm run test:bdd:hu5

      - name: Publicar reporte de Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: reports/
          if-no-files-found: ignore